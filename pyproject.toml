[project]
name = "repo-01-llm-task-router"
version = "0.1.0"
description = "Lesson repo for LLM clients, structured output, tools, and task routing."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "openai>=2.0.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ipykernel>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
